services:
  postgres:
    image: postgres:16
    container_name: reserveforces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reserveforces
      POSTGRES_USER: reserveforces
      POSTGRES_PASSWORD: reserveforces
    ports:
      - "5432:5432"
    volumes:
      - reserveforces-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserveforces -d reserveforces"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reserveforces-pgdata:
