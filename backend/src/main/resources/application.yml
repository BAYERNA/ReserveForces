server:
  port: 8080

spring:
  application:
    name: reserveforces
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reserveforces}
    username: ${DB_USER:reserveforces}
    password: ${DB_PASSWORD:reserveforces}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # 로컬/오프라인 시연 전용 데모 시크릿. 운영 환경에서는 반드시 환경변수로 교체한다.
    secret: ${JWT_SECRET:EDaGYbsZyG7oiza5x0FR73CvyQ5PsRvQKbTq8Q++4e9SzYBP81024/WHyhY7HwaM}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed:
    enabled: ${SEED_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
